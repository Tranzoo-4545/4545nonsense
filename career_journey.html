        }

        }
        
        .header {

        }
        
        .header h1 {

        }
        
        .header p {

            font-size: 15px;
        }
        
        .search-container {
            position: relative;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            font-size: 16px;
            font-family: inherit;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #f0f6f6;
            outline: none;
            transition: all 0.2s;
        }
        
        .search-input:focus {
            border-color: #d4b856;
            background: rgba(255,255,255,0.12);
        }
        
        .search-input::placeholder {
            color: rgba(240,246,246,0.4);
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.5;
        }
        
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a323d;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: none;
        }
        
        .dropdown.show {
            display: block;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .dropdown-item:last-child {
            border-bottom: none;
        }
        
        .dropdown-item:hover {
            background: rgba(212,184,86,0.15);
        }
        
        .profile {
            margin-top: 40px;
            display: none;
        }
        
        .profile.show {
            display: block;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 32px;
            padding: 24px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .profile-name {

            font-weight: 700;
            color: #d4b856;
        }
        
        .profile-subtitle {

        }

            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .stat-card {

            border-radius: 12px;
            padding: 16px 20px;

        }
        
        .stat-value {

            font-weight: 700;
            color: #d4b856;
        }

            gap: 12px;
