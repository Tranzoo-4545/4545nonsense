<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Replay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1719;--panel:#16242a;--ink:#e3ecec;--mist:#8fa6a8;--line:#24404a;
      --teal:#2b7a83;--teal-b:#4db3bf;--gold:#c9a45c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:2rem 1rem 4rem}
h1{font-family:"Barlow Condensed";font-weight:800;font-size:2.6rem;margin:0;color:#fff;letter-spacing:.02em}
h1 span{color:var(--teal-b)}
.sub{color:var(--mist);margin:.3rem 0 1rem}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:.7rem 0 .5rem;border-bottom:1px solid var(--line)}
.hud{display:flex;align-items:flex-end;gap:2rem;flex-wrap:wrap}
.counter{font-family:"Barlow Condensed";font-weight:800;font-size:4.6rem;line-height:.9;color:var(--teal-b);
         font-variant-numeric:tabular-nums;min-width:3ch;transition:color .2s,text-shadow .2s}
.counter.hot{color:var(--gold);text-shadow:0 0 18px rgba(201,164,92,.55)}
.lbl{color:var(--mist);font-size:.82rem}
.clock{font-family:"Barlow Condensed";font-weight:700;font-size:1.7rem;color:#fff;font-variant-numeric:tabular-nums}
.goal b{color:var(--gold);font-family:"Barlow Condensed";font-size:1.5rem}
.ticker{flex:1;min-width:240px;font-size:.78rem;color:var(--mist);height:4.6em;overflow:hidden;line-height:1.15}
.ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .st{color:var(--teal-b)}
.controls{display:flex;gap:.6rem;align-items:center;margin-top:.6rem;flex-wrap:wrap}
button{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:.45rem 1rem;font:600 .9rem Barlow;cursor:pointer}
button:hover{background:var(--teal-b);color:#08282c}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.35rem}
input[type=range]{flex:1;min-width:160px;accent-color:var(--teal-b)}
.banner{display:none;margin-top:.55rem;background:linear-gradient(90deg,#3a3222,#16242a);border:1px solid var(--gold);
        color:var(--gold);border-radius:8px;padding:.45rem .9rem;font-weight:600}
.banner.show{display:block;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:scale(1);opacity:1}}
svg{width:100%;height:110px;display:block;margin-top:.6rem}
.axis{position:relative;height:18px;margin-top:.5rem;color:var(--mist);font-size:.72rem}
.axis span{position:absolute;transform:translateX(-50%)}
.lanes{position:relative;margin-top:.2rem}
.bar{position:absolute;height:5px;border-radius:3px;cursor:pointer;transition:background .15s,box-shadow .15s,opacity .15s}
.bar.pending{background:transparent;box-shadow:inset 0 0 0 1px #2a4a52}
.bar.live{background:var(--teal-b);box-shadow:0 0 6px rgba(77,179,191,.85)}
.bar.done.w{background:#b8c6c7;opacity:.55}
.bar.done.b{background:#50666a;opacity:.85}
.bar.done.d{background:var(--teal);opacity:.75}
.bar:hover{outline:1px solid var(--gold)}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none;z-index:2}
.mark{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;
      background:repeating-linear-gradient(var(--gold) 0 4px,transparent 4px 8px);opacity:.55}
.tip{position:fixed;pointer-events:none;background:#0b1214;border:1px solid var(--teal);border-radius:6px;
     padding:.45rem .6rem;font-size:.8rem;display:none;z-index:9;max-width:320px}
.tip b{color:var(--teal-b)}
.legend{color:var(--mist);font-size:.78rem;margin-top:1rem}
.sw{display:inline-block;width:14px;height:5px;border-radius:2px;margin:0 .35rem 0 .9rem;vertical-align:middle}
</style>
</head>
<body>
<main>
  <h1 id="title">PEAK <span>REPLAY</span></h1>
  <p class="sub" id="sub"></p>
  <div class="top">
    <div class="hud">
      <div><div class="counter" id="count">0</div><div class="lbl">games in progress</div></div>
      <div><div class="clock" id="clock"></div><div class="lbl">UTC</div></div>
      <div class="goal" id="goal"></div>
      <div class="ticker" id="ticker"></div>
    </div>
    <div class="controls">
      <button id="play">&#9654; Play</button>
      <select id="speed" title="replay length">
        <option value="30">Fast (30 s)</option><option value="60" selected>Normal (1 min)</option><option value="120">Slow (2 min)</option>
      </select>
      <input type="range" id="scrub">
      <button id="jump">Jump to peak</button>
    </div>
    <div class="banner" id="banner"></div>
    <svg id="curve" preserveAspectRatio="none"></svg>
  </div>
  <div class="axis" id="axis"></div>
  <div class="lanes" id="lanes"></div>
  <div class="legend">
    <span class="sw" style="background:#4db3bf;box-shadow:0 0 6px #4db3bf"></span>in progress
    <span class="sw" style="background:#b8c6c7"></span>white won
    <span class="sw" style="background:#50666a"></span>black won
    <span class="sw" style="background:#2b7a83"></span>draw
    <span class="sw" style="box-shadow:inset 0 0 0 1px #3a5a62"></span>not started yet
    &nbsp;&middot;&nbsp; each bar is one game &middot; hover for details, click to open it on Lichess
  </div>
</main>
<div class="tip" id="tip"></div>

const G = D.games, P = D.peak, PREV = D.prev;
const pct = t => 100 * (t - T0) / SPAN;
const hhmm = t => new Date(t).toISOString().slice(11, 16);
const $ = id => document.getElementById(id);
const isRecord = !!(PREV && P.n > PREV.n);

$('title').innerHTML = isRecord ? 'NEW <span>RECORD</span>' : 'PEAK <span>REPLAY</span>';
$('sub').textContent = `Season ${D.season}, Round ${D.round} · peak of ${P.n} games at once, ${P.when} · ${G.length} games in this window`;

  : `<div class="lbl">peak</div><b>${P.n}</b>`;

  G.forEach(g => { ev.push([g.s, 1]); ev.push([g.e, -1]); });

  const l = Math.max(0, pct(g.s)), r = Math.min(100, pct(g.e));
  el.style.left = l + '%';
  el.style.width = Math.max(0.25, r - l) + '%';
  el.style.top = (g.row * ROW) + 'px';
  el.onmousemove = ev => {
    const res = g.res === '1/2-1/2' ? '½–½' : g.res;
    tip.innerHTML = `<b>${g.w}</b> – <b>${g.b}</b> &nbsp;${res}<br>${g.wt} vs ${g.bt}<br>` +

// time axis every 30 minutes

// concurrency curve, sampled per minute

  events.push({ t: g.e, html: `${hhmm(g.e)} ■ ${g.w} – ${g.b}: ${res}` });
});

  let msg = '';
  if (breakT && t >= breakT) msg = `\u{1F389} Record broken at ${hhmm(breakT)} UTC — more than ${PREV.n} games at once for the first time`;
  if (t >= P.t) msg = isRecord
    ? `\u{1F389} New all-time record: ${P.n} games at once at ${hhmm(P.t)} UTC (old record ${PREV.n})`
    : `\u{1F3C6} Peak reached: ${P.n} games at once at ${hhmm(P.t)} UTC`;
  if (msg !== banner.dataset.msg) {
    banner.dataset.msg = msg;
    banner.textContent = msg;
    banner.classList.remove('show');
    if (msg) { void banner.offsetWidth; banner.classList.add('show'); }
  }
}
function render(t) {
  let n = 0;
  for (const g of G) {
    const live = g.s <= t && t < g.e;
    n += live;
    g.el.classList.toggle('live', live);
    g.el.classList.toggle('done', t >= g.e);
    g.el.classList.toggle('pending', t < g.s);
  }
  const c = $('count');
  c.textContent = n;
  c.classList.toggle('hot', PREV ? n > PREV.n : n === P.n);
  $('clock').textContent = hhmm(t);
  cursor.style.left = pct(t) + '%';
  const x = W * (t - T0) / SPAN;
  cline.setAttribute('x1', x); cline.setAttribute('x2', x);
  let i = events.length;
  while (i > 0 && events[i - 1].t > t) i--;
  $('ticker').innerHTML = events.slice(Math.max(0, i - 4), i).reverse().map(e => `<div>${e.html}</div>`).join('');
  setBanner(t);
}
scrub.oninput = () => { stop(); cur = +scrub.value; render(cur); };
let raf = null, last = 0;
function tick(ts) {
  if (!last) last = ts;
  const secs = +$('speed').value;
  cur = Math.min(T1, cur + (ts - last) * SPAN / (secs * 1000));
  last = ts; scrub.value = cur; render(cur);
  if (cur >= T1) return stop();
  raf = requestAnimationFrame(tick);
}
function stop() { if (raf) cancelAnimationFrame(raf); raf = null; last = 0; $('play').innerHTML = '&#9654; Play'; }
$('play').onclick = () => {
  if (raf) return stop();
  if (cur >= T1) cur = T0;
  $('play').innerHTML = '&#10074;&#10074; Pause';
  raf = requestAnimationFrame(tick);
};
$('jump').onclick = () => { stop(); cur = P.t; scrub.value = cur; render(cur); };
scrub.value = T0; render(T0);
</script>
