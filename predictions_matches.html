<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Match Predictions - Season 49 Round 4</title>
    <style>
        
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --team-a-color: #58a6ff;
            --team-b-color: #f78166;
            --win-color: #3fb950;
            --draw-color: #d29922;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 2rem;
            line-height: 1.5;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        
        .predictions-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .match-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }
        
        .team {
            font-weight: 600;
            font-size: 1.1rem;
            max-width: 35%;
        }
        
        .team-a { color: var(--team-a-color); }
        .team-b { color: var(--team-b-color); text-align: right; }
        
        .vs {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .prediction-bar {
            display: flex;
            height: 40px;
            margin: 1rem 1.5rem;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .prob-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: white;
            min-width: 40px;
        }
        
        .prob-a { background: var(--team-a-color); }
        .prob-draw { background: var(--draw-color); }
        .prob-b { background: var(--team-b-color); }
        
        .match-details {
            padding: 1rem 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .detail-section {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        
        .detail-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .expected-score {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .current-score {
            font-size: 1.2rem;
            color: var(--win-color);
        }
        
        .boards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            padding: 0 1.5rem 1rem;
        }
        
        .board-card {
            background: var(--bg-card);
            border-radius: 6px;
            padding: 0.5rem;
            font-size: 0.75rem;
        }
        
        .board-players {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        
        .board-player {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .player-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }
        
        .player-rating {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }
        
        .color-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 0.35rem;
            vertical-align: middle;
        }
        
        .color-white {
            background: #fff;
            border: 1px solid #888;
        }
        
        .color-black {
            background: #333;
            border: 1px solid #333;
        }
        
        .score-result {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 1.5rem;
            text-align: center;
        }
        
        .score-prediction {
            font-size: 0.7rem;
            min-width: 2rem;
            text-align: center;
            opacity: 0.8;
        }
        
        .win-prob {
            font-weight: 600;
            font-size: 0.7rem;
        }
        
        .board-result {
            text-align: center;
            font-weight: 600;
            margin-top: 0.25rem;
            padding-top: 0.25rem;
            border-top: 1px solid var(--border-color);
        }
        
        .result-played { color: var(--win-color); }
        .result-pending { color: var(--text-secondary); }
        
        @media (max-width: 768px) {
            .boards-grid { grid-template-columns: repeat(2, 1fr); }
            .match-details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>🎯 Match Predictions</h1>
    <p class="subtitle">Season 49 Round 4 • Monte Carlo Simulation • Generated: 2026-07-20 09:26 UTC</p>
    
    <div class="predictions-container">

    </div>
</body>
</html>
