:root{--bg:#0d1b20;--card:#13272e;--deep:#0f2228;--line:#24434c;--teal:#4db3bf;--teal2:#2b7a83;--gold:#e8b04b;--ink:#e3eef0;--mute:#9bb8bf;--ok:#3fa66b;--low:#ff7a6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:8px 12px 24px}
a{color:var(--teal)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.back{font-size:14px;text-decoration:none}
.top .sub{font-size:13px;color:var(--mute)}
h1{margin:2px 0 6px;font-size:22px;letter-spacing:.3px}
h1 span{color:var(--gold);font-weight:600;font-size:14px;margin-left:6px;letter-spacing:.5px;text-transform:uppercase}
.dots{display:flex;gap:5px;margin:0 0 8px}
.dots i{flex:1;height:20px;border-radius:5px;background:var(--deep);border:1px solid var(--line);font:600 11px/18px system-ui,sans-serif;font-style:normal;text-align:center;color:var(--mute)}
.dots i.now{border-color:var(--gold);color:var(--gold)}
.dots i.rfull{background:var(--ok);border-color:var(--ok);color:#fff}
.dots i.rpart{background:var(--gold);border-color:var(--gold);color:#13272e}
.dots i.rmiss{background:#3a4d53;border-color:#3a4d53;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px 12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
.qhead b{color:var(--teal);font-size:15px}
.timer{font:700 15px/1 ui-monospace,Consolas,monospace;color:var(--ink);background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:5px 10px;white-space:nowrap}
.timer.warn{color:var(--low);border-color:var(--low)}
.timer.stop{color:var(--mute)}
.tbar{height:4px;background:#1d3840;border-radius:2px;margin:6px 4px 4px;overflow:hidden}
.tbar div{height:100%;background:var(--teal);width:100%}
.tbar.warn div{background:var(--low)}
.ask{margin:4px 4px 6px;font-size:15px;font-weight:600}
.bw{display:flex;flex-direction:column;align-items:center;--bsz:min(432px,calc(100vw - 44px))}
.bw .kb{--sq:min(54px,calc((100vw - 44px)/8))!important;box-shadow:none}
.bw .kb .co{font-size:12px;line-height:1}
.kb .sq.hl2::before{content:"";position:absolute;inset:0;background:var(--hl);opacity:.4}
.tomove{width:var(--bsz);display:flex;justify-content:center;align-items:center;font-size:14px;height:26px;font-weight:600;color:var(--ink)}
.clocks{width:var(--bsz);display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.ck{background:var(--deep);border:2px solid var(--line);border-radius:10px;padding:6px 10px 7px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.ck .nm{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);font-weight:600;width:100%}
.ck .nm .mv{margin-left:auto;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.4px}
.ck .t{font:800 34px/1.05 ui-monospace,Consolas,monospace;color:var(--ink);letter-spacing:1px;font-variant-numeric:tabular-nums}
.ck.low{border-color:var(--low);background:#3a1c1a}
.ck.low .t{color:var(--low)}
.ck.low .nm::after{content:"low on time";font-size:11px;color:var(--low);margin-left:6px}
.ck.low.tm .nm::after{content:"low"}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--mute);flex:none}
.dot.w{background:#f0f0f0}.dot.b{background:#111}
.fstat{width:var(--bsz);text-align:center;font-weight:600;font-size:14px;min-height:26px;padding-top:4px;color:var(--ink)}
.fstat.good{color:#6fd39a}.fstat.bad{color:var(--low)}
.opts{display:grid;gap:6px;margin:8px 0 0}
.opts.c7{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c2{grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--teal2);background:var(--deep);color:var(--ink);padding:8px 6px;min-height:48px;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--teal)}
button:disabled{cursor:default}
.opt{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ev{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px 7px;min-height:62px;overflow-wrap:normal}
.ev .sym{font-size:18px;font-weight:700;line-height:1.1}
.ev .rng{font:600 11px/1.15 system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.ev .rng span{display:block;white-space:nowrap}
.ev .cap{font-size:10.5px;line-height:1.15;color:var(--mute);font-weight:500}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.right .cap{color:#e9fff1}
.opt.near{background:var(--gold);border-color:var(--gold);color:#13272e}
.opt.near .cap{color:#3a2a08}
.opt.wrong{background:#5b2c2a;border-color:#a8574f;color:#f4dcd8}
.opt.wrong .cap{color:#e3bdb7}
.opt.dim{opacity:.55}
.reveal{margin:10px 2px 0;padding:10px 12px 12px;border-radius:8px;background:var(--deep);border-left:3px solid var(--gold)}
.reveal .pts{font-size:20px;font-weight:800}
.reveal .pts.pfull{color:#6fd39a}.reveal .pts.ppart{color:var(--gold)}.reveal .pts.pmiss{color:var(--mute);font-size:17px;font-weight:700}
.reveal .fact{margin:4px 0 8px;font-weight:600;overflow-wrap:anywhere}
.crowd{font-size:13px;color:var(--mute)}
.crowd .track{height:8px;background:#1d3840;border-radius:4px;margin:4px 0 2px;overflow:hidden}
.crowd .fill{height:100%;background:var(--teal2)}
.crowd em{font-style:normal;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.next{display:block;width:100%;margin-top:12px;background:var(--teal2);border-color:var(--teal2);font-weight:700;font-size:16px;color:#fff}
#endspot{height:1px}
@media (max-width:640px){.next{position:sticky;bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.55);z-index:5}#endspot{height:12px}}
.total{text-align:center;margin:4px 0}
.total b{font-size:52px;font-weight:800;color:var(--gold);line-height:1}
.total small{font-size:22px;color:var(--gold);font-weight:700}
.total .perf{display:block;font-size:17px;font-weight:700;color:var(--ink);margin-top:6px}
.total .pb{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:#13272e;background:var(--gold);border-radius:12px;padding:2px 10px}
.total .tb{display:block;font-size:13px;color:var(--mute);margin-top:6px}
.better{text-align:center;font-size:14px;color:var(--ink);margin:0 0 10px}
.better em{font-style:normal;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-left:6px}
.total .mode{display:block;font-size:13px;color:var(--mute);margin-top:4px}
.squares{text-align:center;font-size:26px;letter-spacing:2px;margin:6px 0 10px}
.share{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.share pre{margin:0;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.share button{flex:none;background:var(--teal2);border-color:var(--teal2);color:#fff;font-weight:700;min-width:84px}
h2{font-size:16px;margin:18px 4px 6px;color:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{color:var(--mute);font-weight:600;font-size:11.5px;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;width:46px}
td.tm,th.tm{text-align:right;font-variant-numeric:tabular-nums;width:52px;color:var(--mute)}
th.k,td.k{width:24px}
td.rt,th.rt{text-align:right;font-variant-numeric:tabular-nums;width:64px}
td .g{display:block;font-size:12px;color:var(--mute)}
td .arrow{color:var(--mute)}
tr.me td{background:rgba(232,176,75,.14);color:var(--gold);font-weight:700}
.note{font-size:12.5px;color:var(--gold);margin:4px 4px 6px}
.note.m{color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:22px;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--mute)}
.nextq{margin:14px 4px 4px;font-size:14px;color:var(--mute)}
.nextq b{color:var(--ink)}
.practice{width:100%;margin-top:12px;background:transparent}
.startc{padding:16px 14px 18px}
.startc .info{margin:0 0 4px;font-size:15px;color:var(--ink)}
.startc .info b{color:var(--gold)}
.startc .meta{margin:0 0 14px;font-size:13.5px;color:var(--mute)}
.startc label{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
.startc input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:8px;border:1px solid var(--teal2);background:var(--deep);color:var(--ink);min-height:48px}
.startc input:focus{outline:2px solid var(--teal);outline-offset:1px}
.startc .err{min-height:20px;font-size:13px;color:var(--low);margin:4px 2px 2px}
.startc .go{display:block;width:100%;background:var(--teal2);border-color:var(--teal2);font-weight:700;font-size:16px;color:#fff}
.startc .anon{display:inline-block;margin-top:12px;font-size:14px;background:none;border:0;min-height:0;padding:4px 2px;color:var(--teal);text-decoration:underline}
.startc .hint{font-size:12.5px;color:var(--mute);margin:10px 0 0}
.pvbar{background:var(--gold);color:#13272e;font-weight:700;font-size:13px;border-radius:8px;padding:6px 10px;margin:0 0 8px;text-align:center}
.netnote{font-size:13px;color:var(--gold);margin:8px 2px 0}
.dots i.rwait{border-style:dashed;border-color:var(--gold);color:var(--gold)}
.opt.picked{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.retry{margin-top:8px;width:100%}
.pmode{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-right:6px}

const Q = D.questions, KEY = D.week, LIVE = D.mode === 'live';

/* ---- scoring: the SAME function as quiz_backend/Code.gs. The page scores and reveals at once (the answer key is in
   the page - his call 20 Oct 2026, instant answers beat a 2 s wait); the server scores again for the leaderboard. Honza's final scoring: who won 70, opening 90, skeleton 110, eval 140 exact / 60 one
   step off, find the finish 180 if mated within 30 s, 120 within 60 s. Max 870. ---- */
var POINTS = {who: 70, opening: 90, skeleton: 110, eval: 140};
var EVAL_NEAR = 60, MATE_FAST = 180, MATE_SLOW = 120, MATE_FAST_MS = 30000, MATE_MS = 60000, GRACE_MS = 3000;
function scoreAnswer(item, guess, ms) {
  guess = Number(guess); ms = Number(ms);
  if (!isFinite(guess) || guess < 0 || !isFinite(ms) || ms < 0) return 0;
  if (item.type === 'mate') {
    if (guess !== 1) return 0;
    if (ms <= MATE_FAST_MS) return MATE_FAST;
    return ms <= MATE_MS + GRACE_MS ? MATE_SLOW : 0;
  }
  if (ms > Number(item.secs || 30) * 1000 + GRACE_MS) return 0;
  var d = Math.abs(guess - Number(item.answer));
  if (d === 0) return POINTS[item.type] || 0;
  if (item.type === 'eval' && d === 1) return EVAL_NEAR;
  return 0;
}

/* ---- local storage (per browser; may be unavailable) ---- */
const STORE = 'mq4';
function load(){ try { const s = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; return (s && typeof s === 'object') ? s : {}; } catch(e){ return {}; } }
function save(st){ try { localStorage.setItem(STORE, JSON.stringify(st)); } catch(e){} }
function browserId(){
  const st = load();
  if (!st.bid){ st.bid = Array.from({length: 16}, () => 'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 32)]).join(''); save(st); }
  return load().bid || 'nostorage';
}
const BID = browserId();

/* ---- backend: the Apps Script web app (live page only), always in the background. POST text/plain (no preflight). ---- */
const API = {
  async post(body){
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(D.url, {method: 'POST', body: JSON.stringify(body), signal: ctl.signal});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  },
  async board(){
    if (!LIVE) return null;
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(D.url + '?a=board&week=' + encodeURIComponent(KEY), {signal: ctl.signal});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); if (!j.ok) throw new Error(j.error || 'no board'); return j;
    } finally { clearTimeout(t); }
  },
  async claim(nick){ return LIVE ? this.post({a: 'nick', week: KEY, nick, bid: BID}) : {ok: true}; },
  // -> {pts, crowd, dup?, closed?, ...}; throws when the server can't be reached or says no
  async answer(q, guess, ms, nick){
    const r = await this.post({a: 'answer', week: KEY, nick: nick || '', bid: BID, qid: q.qid, guess, ms: Math.round(ms)});
    if (!r || !r.ok) { const e = new Error((r && r.error) || 'bad reply'); e.reply = r || {}; throw e; }
    return r;
  }
};

const nkey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function saveRun(){ if (practice || !run) return; const st = load(); st.prog = st.prog || {}; st.prog[KEY] = run; save(st); }
function pending(){ return (load().pend || {})[KEY] || []; }
function setPending(list){ const st = load(); st.pend = st.pend || {}; st.pend[KEY] = list; save(st); }
function status(q, p){ return p >= q.max ? 'full' : p > 0 ? 'part' : 'miss'; }
function localResult(q, guess, ms){ const it = D.key[q.qid]; return Object.assign({}, it, {pts: scoreAnswer(it, guess, ms)}); }

/* ---- background sends: the nickname claim and every answer go into a queue kept in this browser, sent oldest
   first; a send that fails stays queued and is tried again (next answer, every 20 s, the end screen). ---- */
let flushing = false, shownReveal = -1;
const sentWaiters = [];
function queue(item){
  if (!LIVE || practice) return;
  item.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  setPending(pending().concat([item]));
  flush();
}
function whenSent(){ return new Promise(res => { sentWaiters.push(res); flush(); }); }
async function flush(){
  if (!LIVE || flushing) return;
  flushing = true;
  try {
    for (;;){
      const list = pending();
      if (!list.length) break;
      const p = list[0];
      try {
        if (p.a === 'nick'){
          const r = await API.claim(p.nick);
          if (r && r.error === 'unknown week') break;                      // the key isn't there yet: keep it
          if (r && r.ok === false && r.error === 'nick') nickTrouble(r, p.nick);
          if (r && r.open === false) markClosed();
        } else gotReply(p, await API.answer(Q[p.j], p.guess, p.ms, p.nick));
      } catch(e){
        if (!e.reply || /unknown week/.test(e.reply.error || '')) break;   // still down: keep it for later
        if (e.reply.error === 'nick') nickTrouble(e.reply, p.nick);        // refused: drop it
      }
      const now = pending();
      if (now.length && now[0].id === p.id) setPending(now.slice(1));
    }

/* ---- countdown ---- */
function startTimer(secs, onEnd){
  const t0 = performance.now(), total = secs * 1000;
  const tick = () => {
    const left = Math.max(0, total - (performance.now() - t0)), s = Math.ceil(left / 1000);
    const el = $('#tsec'), bar = $('#tbar');
    if (!el) return stopTimer();
    el.textContent = s + ' s';
    const warn = s <= 5;
    $('#timer').classList.toggle('warn', warn); bar.classList.toggle('warn', warn);
    bar.firstElementChild.style.width = (100 * left / total) + '%';
    if (left <= 0){ stopTimer(); onEnd(); }
  };

function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } const t = $('#timer'); if (t) { t.classList.add('stop'); t.classList.remove('warn'); } }

/* ---- boards ---- */
const FILES = 'abcdefgh';
function sqName(f, r){ return FILES[f] + (r + 1); }
function drawBoard(game, flip, hl, sel, targets, hl2){
  const b = game.board(), out = [];            // b[0] = rank 8
  let chk = null;
  if (game.inCheck()) b.forEach(row => row.forEach(p => { if (p && p.type === 'k' && p.color === game.turn()) chk = p.square; }));
  const ranks = flip ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0], files = flip ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  for (const r of ranks) for (const f of files){
    const s = sqName(f, r), p = b[7 - r][f];
    let cls = ((f + r) % 2 ? 'l' : 'd') + (hl && hl.includes(s) ? ' hl' : '') + (s === chk ? ' chk' : '') + (s === sel ? ' sel' : '') + (hl2 && hl2.includes(s) && !(hl && hl.includes(s)) ? ' hl2' : '');
    if (targets && targets[s]) cls += ' tg' + (p ? ' cap' : '');
    const pc = p ? `<div class="pc ${p.color}${p.type}"></div>` : '';
    const co = (f === files[0] ? `<span class="co r">${r + 1}</span>` : '') + (r === ranks[7] ? `<span class="co f">${FILES[f]}</span>` : '');
    out.push(`<div class="sq ${cls}" data-s="${s}">${pc}${co}</div>`);
  }

}
function clocksBlock(q){
  const [w, b] = q.csec, wtm = q.tomove === 'White to move';
  const low = (me, other) => me < 120 || me * 3 < other;
  const box = (side, t, mine, other, tm) => `<div class="ck${low(mine, other) ? ' low' : ''}${tm ? ' tm' : ''}">
      <span class="nm"><span class="dot ${side[0].toLowerCase()}"></span>${side}${tm ? '<span class="mv">to move</span>' : ''}</span>
      <span class="t">${t}</span></div>`;
  return `<div class="clocks">${box('White', q.clocks[0], w, b, wtm)}${box('Black', q.clocks[1], b, w, !wtm)}</div>`;
}
function boardBlock(q){
  if (q.kind === 'finish') return `<div class="bw"><div class="kb interactive" id="fb"></div><div class="fstat" id="fstat"></div></div>`;
  if (q.kind === 'who') return `<div class="bw">${clocksBlock(q)}${q.board}</div>`;

}

/* ---- find the finish: playable board ---- */
let F = null;
function finishSetup(q){
  mateMs = null;

  finishDraw(); finishStatus(`Your move · mate in ${q.mate}`);
  const el = $('#fb');
  el.addEventListener('pointerdown', e => {
    const s = e.target.closest('.sq')?.dataset.s; if (!s) return;
    e.preventDefault(); finishPress(s);
  });
  el.addEventListener('pointerup', e => {
    if (!F || !F.drag) return; F.drag = false;
    const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.sq')?.dataset.s;
    if (t && F.sel && t !== F.sel && F.targets && F.targets[t]) finishMove(F.sel, t);
  });
}

function finishStatus(t, cls){ const s = $('#fstat'); s.textContent = t; s.className = 'fstat' + (cls ? ' ' + cls : ''); }
function finishPress(s){
  if (answered || F.busy) return;
  if (F.sel && F.targets && F.targets[s]) return finishMove(F.sel, s);
  const p = F.game.get(s);
  if (p && p.color === F.game.turn()){
    const ms = F.game.moves({square: s, verbose: true});
    F.sel = s; F.targets = {}; ms.forEach(m => F.targets[m.to] = true); F.drag = true;
  } else { F.sel = null; F.targets = null; }

}
function finishMove(from, to){
  const ms = F.game.moves({square: from, verbose: true}).filter(m => m.to === to);
  if (!ms.length) return;
  const m = ms.find(x => !x.promotion || x.promotion === 'q');
  let uci = from + to + (m.promotion || '');
  if (m.promotion && !F.node[uci]){                  // accept an under-promotion if that is the accepted one
    const alt = Object.keys(F.node).find(k => k.slice(0, 4) === from + to); if (alt) uci = alt;
  }
  const mv = F.game.move({from, to, promotion: uci[4]});
  F.sel = null; F.targets = null; F.hl = [from, to]; F.hl2 = null;
  const e = F.node[uci];
  if (!e){ finishDraw(); return finishFail(mv.san); }
  if (e.r === null){ mateMs = performance.now() - qStart; finishDraw(); stopTimer(); F.busy = true; finishStatus('Checkmate!', 'good'); return setTimeout(() => answer(1, mateMs), 500); }
  F.left--; F.busy = true; finishDraw(); finishStatus('Good move…', 'good');
  setTimeout(() => {
    if (answered) return;
    const side = F.game.turn() === 'w' ? 'White' : 'Black';
    F.game.move({from: e.r.slice(0, 2), to: e.r.slice(2, 4), promotion: e.r[4]});
    F.hl2 = [from, to]; F.hl = [e.r.slice(0, 2), e.r.slice(2, 4)]; F.node = e.n; F.busy = false;

}
function finishFail(san){

  const q = Q[run.i], sol = q.sol;

    F.game = new Chess(q.fen); F.hl = [q.last.slice(0, 2), q.last.slice(2, 4)]; F.hl2 = null; finishDraw();
    let k = 0;
    const step = () => {
      if (k >= sol.length){ answered = false; return answer(san === null ? -1 : 0, ms); }
      const u = sol[k++]; F.game.move({from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4]}); F.hl = [u.slice(0, 2), u.slice(2, 4)];

}

function answer(k, msGiven){

  run.i = j + 1; run.seen = -1; if (run.i >= Q.length) run.done = true; saveRun();    // answered: a reload moves on

function reveal(q, k, ms, r, j){

    if (x === r.answer) b.classList.add('right'); else if (x === k) b.classList.add(st === 'part' ? 'near' : 'wrong'); else b.classList.add('dim'); });
  const last = j + 1 >= Q.length;

  const links = [`<a href="${esc(r.analysis)}" target="_blank" rel="noopener">Analysis board ↗</a>`];
  if (q.type !== 'eval' && r.game) links.push(`<a href="${esc(r.game)}" target="_blank" rel="noopener">View game ↗</a>`);

    <div class="fact">${esc(r.fact)}</div><div id="crowd"></div><div class="links">${links.join('')}</div></div>

// "N% picked this": made-up numbers in the preview; on the live page the server's reply, if it is back in time
function crowdInto(j){

// share squares in a FIXED question order (q.share: eval, eval, opening, who won x3, skeleton, mate), not play order.
// ⚡ right in under 10 s (display only) > 🟩 right > 🟨 partial (eval one step off, mate after 30 s) > ⬛ missed/timeout
function square(st, ms){ return st === 'full' ? (ms < 10000 ? '⚡' : '🟩') : st === 'part' ? '🟨' : '⬛'; }
function squares(st, tm){ const out = []; Q.forEach((q, j) => { out[q.share] = square(st[j], tm[j]); }); return out.join(''); }
function said(q, k, note, ms){

}

// the shared leaderboard: only once this browser's answers have reached the server (never a made-up one)

  }
  const myNick = practice || closedWeek || run.nickIssue ? null : me.nick;
  let b;
  try { b = await API.board(); } catch(e){ b = undefined; }
  if (!$('#board')) return;
  if (!b){ $('#board').innerHTML = `<p class="note">Can't reach the quiz server right now - the leaderboard will be here when it's back.</p>`; return; }
  const rows = (b.top || []).map(r => Object.assign({}, r, {me: !!myNick && nkey(r.name) === nkey(myNick)}));
  if (myNick && !rows.some(r => r.me)){
    const rank = 1 + (b.dist || []).filter(x => x > total).length;
    rows.push({name: myNick, pts: total, ms: tb, me: true, rank});
  }
  $('#board').innerHTML = rows.length ? `<table><tr><th class="k">#</th><th>Player</th><th class="n">Pts</th><th class="tm">Time</th></tr>
      ${rows.map((r, k) => `<tr class="${r.me ? 'me' : ''}"><td class="k">${r.rank || k + 1}</td><td>${esc(r.name)}${r.me ? ' (you)' : ''}</td><td class="n">${r.pts}</td><td class="tm">${mmss(r.ms)}</td></tr>`).join('')}</table>
    <p class="note m">${b.players || 0} player${b.players === 1 ? '' : 's'} this week. Ties are split by total time on correct answers (less is better).</p>`
    : `<p class="note m">No one on the leaderboard yet.</p>`;
  if (!me.nick && !practice && !closedWeek) $('#board').insertAdjacentHTML('beforeend', '<p class="note m" id="nonick">Played without a nickname, so you are not on the leaderboard.</p>');
  const others = (b.dist || []).slice(), at = others.indexOf(total);
  if (at >= 0) others.splice(at, 1);
  if ($('#better')) $('#better').innerHTML = practice || closedWeek ? '' : others.length ? `Better than ${Math.round(100 * others.filter(x => x < total).length / others.length)}% this week` : 'First to finish this week';
  const s = b.season || [];
  $('#season').innerHTML = `<h2>Season ${D.season} quiz ratings</h2>` + (s.length
    ? `<table><tr><th class="k">#</th><th>Player</th><th class="rt">Rating</th><th class="tm">Weeks</th></tr>${s.map((r, k) =>
        `<tr class="${myNick && nkey(r.name) === nkey(myNick) ? 'me' : ''}"><td class="k">${k + 1}</td><td>${esc(r.name)}</td><td class="rt">${r.rating}</td><td class="tm">${r.weeks}</td></tr>`).join('')}</table>
      <p class="note m">Average quiz performance of each player's best 5 weeks of up to 8; listed after 3 weeks.</p>`
    : `<p class="note m">Players are listed after 3 weeks.</p>`);
}
function copy(txt){
  const done = ok => { $('#copy').textContent = ok ? 'Copied' : 'Select + copy'; };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove(); done(ok); };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => done(true), fallback); else fallback(); }
  catch(e){ fallback(); }
}

/* ---- open: finished -> results; started -> carry on (a question left open counts as time ran out); else start ---- */
$('#sub').textContent = `${Q.length} questions · up to ${MAX} points`;
$('#pvbar').hidden = LIVE;
(function(){
  const st = load(), done = (st[RES] || {})[KEY], prog = (st.prog || {})[KEY];
  if (done){ run = Object.assign(newRun(done.nick), prog || {}, done, {i: Q.length, done: true}); closedWeek = !!run.closed; return end(); }
  if (prog && Array.isArray(prog.picks) && (prog.i > 0 || prog.seen >= 0)){
    run = Object.assign(newRun(prog.nick), prog); closedWeek = !!run.closed;
    if (run.i >= Q.length) return end();
    const left = run.seen === run.i;
    show();
    if (left) timeUp();
    return;
  }
  startScreen();
})();
flush();                                   // anything left from an earlier visit
setInterval(() => { if (LIVE && pending().length && !flushing) whenSent().then(() => { if ($('#retry') && !pending().length) leaderboard(false); }); }, 20000);
</script></body></html>
