name: Update Match Predictions

on:
  # Run automatically 4 times a day during active week
  schedule:
    - cron: '0 6 * * *'    # 6:00 UTC
    - cron: '0 12 * * *'   # 12:00 UTC
    - cron: '0 18 * * *'   # 18:00 UTC
    - cron: '0 23 * * *'   # 23:00 UTC
  
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

  # Match Centre: redraw the page right after the Monday push of its data (Control Panel -> Push to GitHub)
  push:
    paths:
      - 'scripts/match_centre.json'
      - 'scripts/match_centre.py'
      - 'scripts/match_predictor.py'

# one run at a time (a Monday push can meet a scheduled run); a waiting run starts after the current one
concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests openpyxl pandas
      
      - name: Read current season/round from config
        id: config
        run: |
          if [ -f "config.txt" ]; then
            source config.txt
            echo "season=$SEASON" >> $GITHUB_OUTPUT
            echo "round=$ROUND" >> $GITHUB_OUTPUT
          else
            echo "Error: config.txt not found"
            exit 1
          fi
      
      - name: Generate match predictions (current round)
        run: |
          python scripts/match_predictor.py \
            --season ${{ steps.config.outputs.season }} \
            --round ${{ steps.config.outputs.round }} \
            --output predictions \
            --no-cache \
            --fetch-calendar
      
      - name: Generate full season projection
        run: |
          python scripts/match_predictor.py \
            --season ${{ steps.config.outputs.season }} \
            --round ${{ steps.config.outputs.round }} \
            --output predictions \
            --full-season \
            --no-cache
      
      - name: Check if files changed
        id: changes
        run: |
          # Add files to staging to detect both new and modified files
          git add match_centre.html predictions_matches.html predictions_standings.html predictions_distribution.html \
                  predictions_season_standings.html predictions_season_distribution.html 2>/dev/null || true
          # Prediction history (this-week arrows, By-round charts) - own line: a missing file must not stop the pages
          git add scripts/prediction_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update match predictions & season projection ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
