name: Update Storylines

on:
  schedule:
    # Run once daily at 0:01 UTC
    - cron: '1 0 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      season:
        description: 'Season number'
        required: false
      round:
        description: 'Round number'
        required: false

jobs:
  update-storylines:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests openpyxl
      
      - name: Read current season/round from config
        id: config
        run: |
          source config.txt
          echo "season=${SEASON}" >> $GITHUB_OUTPUT
          echo "round=${ROUND}" >> $GITHUB_OUTPUT
      
      - name: Download ICS calendar
        run: curl -o calendar.ics "https://www.lichess4545.com/team4545/season/${{ steps.config.outputs.season }}/pairings/calendar.ics"
      
      - name: Generate storylines HTML
        run: |
          python scripts/storylines_v4.py \
            --season ${{ steps.config.outputs.season }} \
            --round ${{ steps.config.outputs.round }} \
            --ics calendar.ics \
            --output top_storylines.html
      
      - name: Generate daily games HTML
        run: |
          python scripts/storylines_v4.py \
            --season ${{ steps.config.outputs.season }} \
            --round ${{ steps.config.outputs.round }} \
            --ics calendar.ics \
            --daily \
            --output daily_games.html
      
      - name: Commit and push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add top_storylines.html daily_games.html
          git diff --staged --quiet || (git commit -m "Update storylines" && git push)
