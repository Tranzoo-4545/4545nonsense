<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season 50 Round 2 — Pairing Previews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#ece7dc;--ivory-deep:#ddd5c4;--coal:#17151a;--coal-soft:#242129;--page:#211f24;
      --ink:#2a2723;--mist:#b8b3ac;--gold:#c9a45c;--line:#3a363f}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:#e6e2da;font-family:Barlow,system-ui,sans-serif;
     display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem}
.topbar{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:center;
        margin-bottom:1.2rem;gap:1rem;flex-wrap:wrap}
.context{font-family:"Barlow Condensed";font-size:1.15rem;font-weight:700;letter-spacing:.03em;color:var(--mist)}
.context b{color:#fff}
select{background:var(--coal-soft);color:#e6e2da;border:1px solid var(--line);border-radius:6px;
       padding:.5rem .8rem;font-family:Barlow;font-size:.95rem;max-width:60vw}
select:focus{outline:2px solid var(--gold)}
.card{width:100%;max-width:880px;border-radius:14px;overflow:hidden;background:var(--coal);
      box-shadow:0 20px 60px rgba(0,0,0,.45)}
.tape{display:grid;grid-template-columns:1fr 84px 1fr}
.side{padding:1.6rem 1.4rem 1.2rem}
.side.white{background:var(--ivory);color:var(--ink);text-align:right}
.side.black{background:var(--coal);color:#f0ece4;text-align:left}
.side .team{font-size:.9rem;opacity:.75;margin-bottom:.2rem}
.side .name{font-family:"Barlow Condensed";font-weight:800;font-size:2.2rem;line-height:1;word-break:break-word}
.side .rating{font-family:"Barlow Condensed";font-weight:700;font-size:1.6rem;margin-top:.4rem}
.side .rating small{font-size:.8rem;font-weight:500;opacity:.6;margin-left:.25rem}
.spine{background:linear-gradient(180deg,var(--ivory) 0 50%,var(--coal) 50% 100%);position:relative}
.spine .vs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--gold);
           color:#221c10;font-family:"Barlow Condensed";font-weight:800;font-size:1.2rem;width:52px;height:52px;
           border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px var(--page)}
.gapchip{position:absolute;bottom:.6rem;left:50%;transform:translateX(-50%);white-space:nowrap;
         font-size:.72rem;color:var(--mist);background:var(--page);border-radius:10px;padding:.15rem .5rem}
.ctxstrip{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center}
.ctxstrip .cs{padding:.55rem 1.4rem;font-size:.82rem}
.ctxstrip .cs.w{background:#e2dccd;color:#4a443a;text-align:right}
.ctxstrip .cs.b{background:#1e1b22;color:#b8b3ac;text-align:left}
.ctxstrip .csmid{background:linear-gradient(90deg,#e2dccd 0 50%,#1e1b22 50% 100%);height:100%;
                 display:flex;align-items:center;justify-content:center}
.ctxstrip .csmid span{font-size:.68rem;color:var(--page);background:var(--gold);
                      border-radius:8px;padding:.1rem .45rem;font-weight:600}
.ctxstrip b{font-weight:600}
.ctxstrip .star{color:#a07818}
.ctxstrip .cs.b .star{color:var(--gold)}
.ctxstrip .chase{opacity:.75}
.predict{padding:1.1rem 1.4rem 1.4rem;background:var(--coal-soft)}
.predict h2,section h2{font-family:"Barlow Condensed";font-weight:700;font-size:1.05rem;letter-spacing:.05em;
        color:var(--gold);margin:0 0 .6rem}
.pbar{display:flex;height:30px;border-radius:6px;overflow:hidden;font-family:"Barlow Condensed";font-weight:700;font-size:1rem}
.pbar div{display:flex;align-items:center;justify-content:center;min-width:0}
.pw{background:var(--ivory);color:var(--ink)}.pd{background:#5a5560;color:#e6e2da}.pb{background:#000;color:var(--ivory)}
.plabels{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mist);margin-top:.35rem}
section{padding:1.1rem 1.4rem;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;padding:.35rem 0;gap:.6rem}
.row .l{text-align:right;font-weight:600}.row .r{text-align:left;font-weight:600}
.row .m{text-align:center;font-size:.78rem;color:var(--mist)}
.form{font-family:"Barlow Condensed";font-weight:700;font-size:1.15rem;letter-spacing:.28em}
.form .W{color:#7fc97f}.form .D{color:#9a94a3}.form .L{color:#d97b6f}
.duel{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:.6rem;padding:.3rem 0}
.duel .m{text-align:center;font-size:.78rem;color:var(--mist)}
.track{height:12px;border-radius:6px;background:#312d36;position:relative;overflow:hidden}
.track span{position:absolute;top:0;height:100%}
.track.left span{right:0;background:var(--ivory-deep)}.track.right span{left:0;background:#77716b}
.duelval{font-size:.85rem;font-weight:600;margin-top:.15rem;color:var(--mist)}
.duel .cell.l{text-align:right}.duel .cell.r{text-align:left}
.opening{background:var(--coal-soft)}
.opening .forecast{font-family:"Barlow Condensed";font-weight:700;font-size:1.5rem;text-align:center;color:#f0ece4;margin:.2rem 0 .5rem}
.opening .why{display:flex;justify-content:center;gap:2.5rem;font-size:.85rem;color:var(--mist);flex-wrap:wrap}
.winhint{font-size:.75rem;color:#77717c;margin:-.35rem 0 .6rem}
.h2hscore{font-family:"Barlow Condensed";font-weight:700;font-size:1.2rem;text-align:center;
          color:#f0ece4;margin:.1rem 0 .6rem}
.h2hscore b{color:var(--gold);font-size:1.35rem;margin:0 .2rem}
.meeting{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.meeting:last-child{border:none}
.meeting .res{font-family:"Barlow Condensed";font-weight:700;color:var(--gold)}
.meeting a{color:var(--mist)}
.hype{background:var(--gold);color:#221c10;padding:.9rem 1.4rem}
.hype .top{display:flex;align-items:center;gap:1rem}
.hype .label{font-family:"Barlow Condensed";font-weight:800;font-size:1.1rem;letter-spacing:.04em}
.meter{flex:1;height:10px;border-radius:5px;background:#a3843f55;overflow:hidden}
.meter span{display:block;height:100%;background:#221c10}
.hype .score{font-family:"Barlow Condensed";font-weight:800;font-size:1.3rem}
.hype ul{margin:.5rem 0 0;padding-left:1.2rem;font-size:.88rem;color:#4a3d22}
.hype li{margin:.1rem 0}
.na{color:#6a6572;font-weight:400;font-size:.85rem}
@media (max-width:640px){.tape{grid-template-columns:1fr 52px 1fr}.side .name{font-size:1.4rem}
  .spine .vs{width:40px;height:40px;font-size:1rem}.gapchip{display:none}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function formHTML(f){
  if(!f.length) return '<span class="na">no games yet</span>';
  return '<span class="form">'+f.map(x=>`<span class="${x}">${x}</span>`).join("")+'</span>';
}
function duel(label, wv, bv, unit, max){
  if(wv==null && bv==null) return "";
  const bar=(v,side)=>v==null?'<span class="na">no data</span>':
    `<div class="track ${side}"><span style="width:${Math.min(100,Math.round(100*v/max))}%"></span></div><div class="duelval">${v}${unit}</div>`;
  return `<div class="duel"><div class="cell l">${bar(wv,'left')}</div><div class="m">${label}</div><div class="cell r">${bar(bv,'right')}</div></div>`;
}
function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function pts(x){return x===Math.floor(x)?x:(Math.floor(x)?Math.floor(x)+"½":"½")}
function ctxHTML(side){
  const x=side.ctx||{};
  if(!x.pos&&x.score==null) return "";
  const bits=[];
  if(x.pos) bits.push(`<b>${ordinal(x.pos)}</b>, ${x.mp} MP`+(x.chasing?` <span class="chase">(${x.chasing} MP off first)</span>`:""));
  if(x.score!=null&&x.games) bits.push(`<b>${pts(x.score)}/${x.games}</b> this season`+(x.top?' <span class="star">★ top scorer</span>':''));
  return bits.join(" — ");
}
function render(c){
  const g=Math.abs(c.white.rating-c.black.rating);
  const wctx=ctxHTML(c.white), bctx=ctxHTML(c.black);
  const ctxstrip=(wctx||bctx)?`<div class="ctxstrip"><div class="cs w">${wctx}</div><div class="csmid"><span>team stakes</span></div><div class="cs b">${bctx}</div></div>`:"";
  let h2h;
  if(c.h2h.length){
    let wPts=0,bPts=0;
    const rows=c.h2h.map(m=>{
      const wLower=c.white.name.toLowerCase(), mWhite=m.white.toLowerCase();
      let verdict;
      if(m.result==="1/2-1/2"){verdict="draw";wPts+=.5;bPts+=.5}
      else{
        const winner=(m.result==="1-0")?m.white:(mWhite===wLower?c.black.name:c.white.name);
        if(winner.toLowerCase()===wLower){wPts+=1}else{bPts+=1}
        verdict=`<b>${esc(winner)}</b> won`;
      }
      const colour=(m.white.toLowerCase()===wLower)?`${esc(c.white.name)} had white`:`${esc(c.black.name)} had white`;
      return `<div class="meeting"><span>${m.when}</span><span class="res">${verdict}</span>`+
             `<span>${colour} · <a href="${m.link}" target="_blank">game</a></span></div>`;
    }).join("");
    const fmt=x=>(x===Math.floor(x)?x:(Math.floor(x)?Math.floor(x)+"½":"½"));
    h2h=`<div class="h2hscore">${esc(c.white.name)} <b>${fmt(wPts)} – ${fmt(bPts)}</b> ${esc(c.black.name)}</div>`+rows;
  } else {
    h2h='<div class="meeting"><span>First ever league meeting</span><span class="res">—</span><span></span></div>';
  }
  const opening=c.opening?`
  <section class="opening"><h2>Opening crystal ball</h2><div class="winhint">based on league games, seasons 48-50</div>
    <div class="forecast">${esc(c.opening.line)}</div>
    <div class="why"><span>${esc(c.opening.why_w)}</span><span>${esc(c.opening.why_b)}</span></div>
  </section>`:"";
  const hype=c.hype!=null?`
  <div class="hype"><div class="top">
    <span class="label">Hype meter</span>
    <div class="meter"><span style="width:${Math.min(100,c.hype*10)}%"></span></div>
    <span class="score">${c.hype.toFixed(1)}</span></div>
    ${c.hype_reasons.length?'<ul>'+c.hype_reasons.map(r=>`<li>${esc(r)}</li>`).join("")+'</ul>':''}
  </div>`:"";
  document.getElementById("card").innerHTML=`
  <div class="tape">
    <div class="side white"><div class="team">${esc(c.white.team)}</div><div class="name">${esc(c.white.name)}</div>
      <div class="rating">${c.white.rating}<small>${c.white.rtag}</small></div></div>
    <div class="spine"><div class="vs">vs</div><div class="gapchip">gap ${g}</div></div>
    <div class="side black"><div class="team">${esc(c.black.team)}</div><div class="name">${esc(c.black.name)}</div>
      <div class="rating">${c.black.rating}<small>${c.black.rtag}</small></div></div>
  </div>
  ${ctxstrip}
  <div class="predict"><h2>Prediction</h2>
    <div class="pbar"><div class="pw" style="width:${c.predict.w}%">${c.predict.w}%</div>
    <div class="pd" style="width:${c.predict.d}%">${c.predict.d}%</div>
    <div class="pb" style="width:${c.predict.b}%">${c.predict.b}%</div></div>
    <div class="plabels"><span>${esc(c.white.name)} wins</span><span>draw</span><span>${esc(c.black.name)} wins</span></div>
  </div>
  <section><h2>League form and career</h2>
    <div class="row"><div class="l">${formHTML(c.white.form)}</div><div class="m">this season (W/D/L)</div><div class="r">${formHTML(c.black.form)}</div></div>
    <div class="row"><div class="l">${esc(c.white.career)}</div><div class="m">league career</div><div class="r">${esc(c.black.career)}</div></div>
    <div class="row"><div class="l">${esc(c.white.fame)}</div><div class="m">scouting note</div><div class="r">${esc(c.black.fame)}</div></div>
  </section>
  <section><h2>Style contrast</h2><div class="winhint">league games, seasons 48-50</div>
    ${duel("avg game length", c.white.style.moves, c.black.style.moves, " mv", 60)}
    ${duel("avg game time", c.white.style.duration, c.black.style.duration, " min", 150)}
    ${duel("avg clock left", c.white.style.clock, c.black.style.clock, " min", 30)}
    ${duel("decisive games", c.white.style.decisive, c.black.style.decisive, "%", 100)}
  </section>
  ${opening}
  <section><h2>Head to head</h2>${h2h}</section>
  ${hype}`;
}
const picker=document.getElementById("picker");
let group=null,last=null;
cards.forEach((c,i)=>{
  if(c.matchup!==last){group=document.createElement("optgroup");group.label=c.matchup;picker.appendChild(group);last=c.matchup}
  const o=document.createElement("option");
  o.value=i;
  o.textContent=c.label+(c.hype!=null?`  ★${c.hype.toFixed(1)}`:"");
  group.appendChild(o);
});
picker.addEventListener("change",e=>render(cards[e.target.value]));
render(cards[0]);
</script>
</body>
</html>
