<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Games of the Day - Season 49 Round 6</title>
    <style>
        :root {
            --bg-primary: #2d5266;
            --bg-dark: #234250;
            --bg-darker: #1a323d;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #f0f6f6;
            --text-secondary: rgba(240, 246, 246, 0.7);
            --text-muted: rgba(240, 246, 246, 0.4);
            --border: rgba(255, 255, 255, 0.12);
            --gold: #d4b856;
            --accent: #4a9ebb;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 50%, var(--bg-primary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            text-align: center;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--gold);
        }
        
        .message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        
        .hint {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        
        footer {
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📅 Coming Soon!</h1>
            <div class="message">
                Top Games of the Day for Season 49 Round 6 will be available on Wednesday.
            </div>
            <div class="hint">
                Players are still scheduling their games. Check back Wednesday morning for the daily highlights!
            </div>
        </div>
        <footer>
            Generated for <a href="https://www.lichess4545.com" target="_blank">Lichess4545</a> League
        </footer>
    </div>
</body>
</html>
