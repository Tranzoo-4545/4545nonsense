<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivalry Tracker - Season 49, Round 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3a45 0%, #2c5f6f 50%, #3d7a8a 100%);
            padding: 30px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            background: #1a3a45;
            padding: 35px 40px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            color: white;
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .header .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 1.1em;
        }
        
        .section-label-multiple {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            color: white;
            font-size: 0.9em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 14px 24px;
            margin-bottom: 0;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-label-multiple::before {
            content: "◆";
            color: white;
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .section-label-single {
            background: #64748b;
            color: white;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 12px 24px;
            margin-bottom: 0;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .section {
            margin-bottom: 50px;
        }
        
        .section .rivalry-card:first-of-type {
            border-radius: 0 0 10px 10px;
            margin-top: 0;
        }
        
        .rivalry-card {
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }
        
        .rivalry-card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        
        .resolution-callout {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .resolution-winner {
            font-size: 1.25em;
            font-weight: 700;
            color: #1a202c;
        }
        
        .resolution-color {
            font-size: 1.1em;
        }
        
        .resolution-link {
            color: #2c5f6f;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
        }
        
        .resolution-link:hover {
            text-decoration: underline;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .players {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .player-name {
            font-size: 1.25em;
            font-weight: 600;
            color: #1a202c;
        }
        
        .vs {
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.9em;
        }
        
        .games-count {
            background: #f1f5f9;
            color: #475569;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .card-body {
            padding: 20px 24px;
        }
        
        .h2h-container {
            margin-bottom: 20px;
        }
        
        .h2h-label {
            font-size: 0.85em;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .h2h-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 8px;
        }
        
        .h2h-score {
            font-size: 1.3em;
            font-weight: 700;
            color: #334155;
            min-width: 40px;
            text-align: center;
        }
        
        .h2h-bar {
            flex: 1;
            height: 28px;
            background: #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
        }
        
        .h2h-bar-fill {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8em;
            color: white;
            transition: width 0.3s ease;
        }
        
        .h2h-bar-fill.left {
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f4 100%);
            border: 2px solid #a8a29e;
            border-right: none;
            border-radius: 14px 0 0 14px;
            color: #1c1917;
        }
        
        .h2h-bar-fill.right {
            background: linear-gradient(135deg, #292524 0%, #1c1917 100%);
            border: 2px solid #1c1917;
            border-left: none;
            border-radius: 0 14px 14px 0;
            color: white;
        }
        
        .h2h-bar-fill.draw {
            background: #94a3b8;
            border: none;
            color: white;
        }
        
        .h2h-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            color: #64748b;
        }
        
        .h2h-breakdown {
            font-weight: 500;
        }
        
        .h2h-leader {
            font-weight: 600;
            color: #334155;
        }
        
        .h2h-leader.right {
            text-align: right;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-item {
            flex: 1;
        }
        
        .form-label {
            font-size: 0.85em;
            color: #64748b;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }
        
        .form-letters {
            display: flex;
            gap: 4px;
        }
        
        .form-letter {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85em;
        }
        
        .form-letter.W {
            background: #059669;
            color: white;
        }
        
        .form-letter.L {
            background: #0284c7;
            color: white;
        }
        
        .form-letter.D {
            background: #94a3b8;
            color: white;
        }
        
        .history-section {
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        
        .history-header {
            margin-bottom: 12px;
        }
        
        .history-title {
            font-size: 0.9em;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .history-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 6px;
            font-size: 0.9em;
        }
        
        .history-round {
            font-weight: 600;
            color: #475569;
            min-width: 60px;
        }
        
        .history-matchup {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .color-icon {
            font-size: 0.9em;
        }
        
        .history-player {
            color: #334155;
            font-weight: 500;
        }
        
        .history-vs {
            color: #94a3b8;
            font-size: 0.85em;
        }
        
        .history-result {
            font-weight: 700;
            min-width: 40px;
            text-align: center;
        }
        
        .history-result.white-win {
            color: #1c1917;
        }
        
        .history-result.black-win {
            color: #1c1917;
        }
        
        .history-result.draw {
            color: #64748b;
        }
        
        .history-link {
            color: #2c5f6f;
            text-decoration: none;
            font-weight: 500;
            min-width: 60px;
            text-align: right;
        }
        
        .history-link:hover {
            text-decoration: underline;
        }
        
        .single-game-inline {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 6px;
            font-size: 0.9em;
            border-top: 1px solid #e2e8f0;
            margin-top: 16px;
        }
        
        .single-game-label {
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }
        
        .no-rematches {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #64748b;
            font-size: 1.1em;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-top: 40px;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }
            
            .form-row {
                flex-direction: column;
                gap: 12px;
            }
            
            .history-row {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Rivalry Tracker</h1>
            <div class="subtitle">Season 49 • Round 2</div>
        </div>

        <div class="no-rematches">
            No rematches found in this round. All pairings were first-time meetings!
        </div>

        <div class="footer">
            <p>Generated on 2026-07-13 • Lichess 4545 Rivalry Tracker</p>
        </div>
    </div>
</body>
</html>
